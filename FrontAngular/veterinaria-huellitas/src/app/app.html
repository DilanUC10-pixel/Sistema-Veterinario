<div class="flex h-screen flex-col bg-gray-50">

  <header class="h-16 shrink-0 bg-white border-b border-gray-200 shadow-sm z-10">
    <div class="h-full px-4 flex items-center justify-between">

      <a routerLink="/app/home-comp" class="flex items-center gap-2 text-bosque-oscuro">
        <mat-icon class="!w-8 !h-8 !text-[32px]">pets</mat-icon>
        <span class="text-2xl font-bold">Veterinaria Huellitas</span>
      </a>

      @if (!authService.isLoggedIn()) {
        <nav class="flex items-center gap-3">
          <a routerLink="/app/login-comp"
             class="px-5 py-2 rounded-full border border-gray-300 text-sm font-semibold text-bosque-oscuro hover:bg-gray-50 transition-colors">
            Iniciar sesión
          </a>
          <a routerLink="/app/registro-comp"
             class="px-5 py-2 rounded-full bg-bosque text-white text-sm font-semibold hover:bg-bosque-oscuro transition-colors">
            Registrarse
          </a>
        </nav>
      }
    </div>
  </header>

  @if (authService.isLoggedIn()) {

    <!-- CON SESIÓN: menú lateral a la izquierda, debajo del header -->
    <mat-sidenav-container class="flex-1 min-h-0 !bg-transparent">

      <mat-sidenav mode="side" opened
                   class="!w-64 !bg-white !border-r !border-gray-200 !rounded-none">

        <div class="flex h-full flex-col">

          <!-- Etiqueta de sección -->
          <p class="px-6 pt-5 pb-2 text-xs font-semibold uppercase tracking-wider text-gray-400">
            Menú
          </p>

          <!-- Navegación -->
          <nav class="flex-1 overflow-y-auto px-3 pb-3 space-y-1">

            @for (item of menu; track item.ruta) {
              <a [routerLink]="item.ruta"
                 routerLinkActive="!bg-bosque/10 !text-bosque-oscuro font-semibold border-bosque"
                 class="group flex items-center gap-3 rounded-xl border-l-4 border-transparent
                        px-3 py-2.5 text-sm text-gray-600 transition-colors
                        hover:bg-gray-100 hover:text-bosque-oscuro">
                <mat-icon class="!w-6 !h-6 !text-[22px] text-gray-400 group-hover:text-bosque">{{ item.icon }}</mat-icon>
                <span>{{ item.label }}</span>
              </a>
            }
          </nav>

          <!-- Pie: cerrar sesión -->
          <div class="border-t border-gray-200 p-3">
            <button type="button" (click)="onLogout()"
                    class="group flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm
                           font-medium text-gray-600 transition-colors
                           hover:bg-red-50 hover:text-red-600">
              <mat-icon class="!w-6 !h-6 !text-[22px] text-gray-400 group-hover:text-red-500">logout</mat-icon>
              <span>Cerrar sesión</span>
            </button>
          </div>

        </div>
      </mat-sidenav>

      <mat-sidenav-content class="!bg-gray-50">
        <div class="p-6">
          <router-outlet />
        </div>
      </mat-sidenav-content>

    </mat-sidenav-container>

  } @else {

    <!-- SIN SESIÓN: solo el contenido -->
    <main class="flex-1 min-h-0 overflow-y-auto">
      <router-outlet />
    </main>

  }
</div>
